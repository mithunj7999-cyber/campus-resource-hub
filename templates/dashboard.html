<!DOCTYPE html>
<html>
<head>
    <title>Vault. | Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue: #00246B;
            --sky-blue: #CADCFC;
            --glass-bg: rgba(202, 220, 252, 0.2); 
            --glass-border: rgba(202, 220, 252, 0.4);
            --accent: #FF5E6C;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .dashboard-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            color: var(--deep-blue);
            margin: 0;
            letter-spacing: -1px;
        }

        .brand-title span { color: var(--accent); }

        .welcome {
            font-size: 1rem;
            color: var(--deep-blue);
            font-weight: 600;
        }

        .logout-btn {
            background: var(--deep-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: var(--sky-blue);
            color: var(--deep-blue);
        }

        .menu {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu a {
            flex: 1;
            text-align: center;
            background: var(--deep-blue);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .menu a:hover {
            background: var(--sky-blue);
            color: var(--deep-blue);
        }

        .search-box {
            margin-top: 20px;
            text-align: center;
        }

        .search-box input {
            padding: 12px;
            width: 60%;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            outline: none;
        }

        .search-box button {
            padding: 12px 20px;
            background: var(--deep-blue);
            color: white;
            border: none;
            border-radius: 12px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .search-box button:hover {
            background: var(--sky-blue);
            color: var(--deep-blue);
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h1 class="brand-title">Vault<span>.</span></h1>
        <div>
            <span class="welcome">Welcome, {{ session.username }}</span>
            <a href="/logout"><button class="logout-btn">Logout</button></a>
        </div>
    </div>

    <h2 style="color: var(--deep-blue);">Dashboard</h2>

    <div class="menu">
        <a href="/upload">Upload Notes</a>
        <a href="/view">View Notes</a>
    </div>

    <div class="search-box">
        <form action="/search" method="GET">
            <input type="text" name="query" placeholder="Search notes..." required>
            <button type="submit">Search</button>
        </form>
    </div>
</div>

</body>
</html>
